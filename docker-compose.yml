name: arki
services:
  app:
    build: .
    restart: unless-stopped
    ports:
      - "127.0.0.1:${HOST_PORT:-8080}:3000"
    environment:
      NODE_ENV: production
      DB_PATH: /app/data/household.db
      JWT_SECRET: ${JWT_SECRET:?Run node scripts/configure.mjs first}
      SETUP_TOKEN: ${SETUP_TOKEN:?Run node scripts/configure.mjs first}
      TRUST_PROXY: ${TRUST_PROXY:-0}
      SHOP_DIRECTORY_BBOX: ${SHOP_DIRECTORY_BBOX:-}
      MAP_USER_AGENT: ${MAP_USER_AGENT:-Arki/1.0}
    volumes:
      - household_data:/app/data
volumes:
  household_data:
